[package]
name = "webtronix"
version = "0.1.0"
edition = "2024"
description = "Fetch a list of URLs concurrently and extract their text into a SQLite index"

[features]
default = ["cli"]
# The `webtronix` binary and what only it needs. Off, only the library is
# built, without clap, indicatif, toml or tracing-subscriber.
cli = ["dep:clap", "dep:indicatif", "dep:toml", "dep:tracing-subscriber"]

[[bin]]
name = "webtronix"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
chromiumoxide = { version = "0.9.1", default-features = false }
clap = { version = "4.5", features = ["derive"], optional = true }
eyre = "0.6"
futures = "0.3"
indicatif = { version = "0.18", optional = true }
pdf-extract = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
trafilatura = "0.5"
