[package]
name = "webtronix"
version = "0.1.0"
edition = "2024"
description = "Fetch a list of URLs concurrently and extract their text into a SQLite index"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.25"
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
